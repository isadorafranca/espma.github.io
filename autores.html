<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autores | ESP/MA</title><meta name="description" content="Autores, professores, estudantes e colaboradores presentes nos registros do Repositório Institucional ESP/MA."><meta name="keywords" content="autores, pesquisadores, ESP/MA, produção acadêmica"><meta property="og:title" content="Autores | Repositório ESP/MA"><meta property="og:description" content="Consulte os autores presentes nos registros do catálogo."><meta property="og:type" content="website"><link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/styles.css"></head><body><div data-header></div><main id="conteudo"><section class="page-hero"><div class="container"><p class="breadcrumb"><a href="index.html">Início</a> / Autores</p><p class="eyebrow">Pessoas e produção</p><h1>Autores</h1><p>Esta lista é formada exclusivamente pelos nomes presentes nos registros cadastrados. Novos dados serão exibidos somente quando forem adicionados ao catálogo.</p></div></section><section class="section"><div class="container"><div id="authors" class="author-list"></div></div></section></main><div data-footer></div><script type="module">import {getData,countAuthors} from './assets/js/data.js';import {renderShell} from './assets/js/components.js';import {setMeta,esc} from './assets/js/site-config.js';renderShell('Autores');setMeta({title:'Autores'});const {docs,autores}=await getData();const counts=countAuthors(docs);document.querySelector('#authors').innerHTML=autores.map(name=>`<article class="profile-card"><p class="eyebrow">Autor no catálogo</p><h2>${esc(name)}</h2><p>${counts[name]} ${counts[name]===1?'produção registrada':'produções registradas'}</p><a href="autor.html?nome=${encodeURIComponent(name)}">Ver produções →</a></article>`).join('');</script></body></html>
