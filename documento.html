<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documento | ESP/MA</title><meta name="description" content="Registro documental do Repositório Institucional da ESP/MA."><meta name="keywords" content="documento, metadados, ESP/MA, saúde pública"><meta property="og:title" content="Documento | Repositório ESP/MA"><meta property="og:description" content="Registro documental com metadados e informações de acesso."><meta property="og:type" content="article"><link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/styles.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"ScholarlyArticle","headline":"Registro documental do Repositório Institucional ESP/MA","publisher":{"@type":"EducationalOrganization","name":"Escola de Saúde Pública do Maranhão"},"inLanguage":"pt-BR"}</script></head><body><div data-header></div><main id="conteudo"><section class="page-hero"><div class="container"><p class="breadcrumb"><a href="index.html">Início</a> / <a href="documentos.html">Produções</a> / Registro</p><div id="detail-kicker"></div></div></section><section class="section"><div class="container" id="document-detail"></div></section></main><div data-footer></div><script type="module">import {getData,formatDate} from './assets/js/data.js';import {renderShell} from './assets/js/components.js';import {SITE,esc,setMeta} from './assets/js/site-config.js';renderShell('Produções');const {docs}=await getData();const doc=docs.find(d=>d.id===new URLSearchParams(location.search).get('id'));const root=document.querySelector('#document-detail');if(!doc){setMeta({title:'Registro não encontrado',description:'O registro solicitado não foi localizado no catálogo.'});root.innerHTML='<div class="empty-state"><span aria-hidden="true">?</span><h1>Registro não encontrado</h1><p>O documento solicitado não existe ou foi removido do catálogo.</p><a class="button primary" href="documentos.html">Voltar às produções</a></div>'}else{setMeta({title:doc.titulo,description:doc.resumo,type:'article'});document.querySelector('#detail-kicker').innerHTML=`<p class="eyebrow">${esc(doc.tipo)} · ${esc(doc.colecao)}</p>`;const demo=doc.id.startsWith('demo-');const rows=[['Autores',(doc.autores||[]).map(esc).join(', ')],['Ano',esc(doc.ano)],['Tipo de documento',esc(doc.tipo)],['Coleção',`<a href="documentos.html?colecao=${encodeURIComponent(doc.colecao)}">${esc(doc.colecao)}</a>`],['Curso',esc(doc.curso)],['Instituição',esc(doc.instituicao||SITE.institution)],['Área temática',esc(doc.area)],['Palavras-chave',(doc.palavras_chave||[]).map(esc).join(' · ')],['Data de publicação',esc(formatDate(doc.data_publicacao))],['Identificador',esc(doc.identificador||doc.id)],['DOI',doc.doi?`<a href="https://doi.org/${encodeURIComponent(doc.doi)}">${esc(doc.doi)}</a>`:'Não informado'],['Licença',esc(doc.licenca||'Não informada')]];root.innerHTML=`<div class="detail-layout"><article class="detail-main"><div class="doc-topline"><span class="tag">${esc(doc.tipo)}</span>${demo?'<span class="demo-badge">Registro demonstrativo</span>':''}<span class="doc-year">${esc(doc.ano)}</span></div><h1>${esc(doc.titulo)}</h1><p class="doc-author">${(doc.autores||[]).map(esc).join(' · ')}</p>${demo?`<div class="demo-note"><strong>Registro demonstrativo.</strong> Este conteúdo existe apenas para mostrar a interface. Deve ser substituído por um documento autorizado antes da publicação oficial.</div>`:''}<h2>Resumo</h2><p class="lead">${esc(doc.resumo)}</p><h2>Metadados</h2><dl class="meta-list">${rows.map(([k,v])=>`<div class="meta-row"><dt>${k}</dt><dd>${v||'Não informado'}</dd></div>`).join('')}</dl><h2>Citação sugerida</h2><p>${esc((doc.autores||[]).join('; '))}. ${esc(doc.titulo)}. ${esc(doc.instituicao||SITE.institution)}, ${esc(doc.ano)}. ${doc.doi?`DOI: ${esc(doc.doi)}.`:''}</p></article><aside class="detail-sidebar"><div class="action-box"><h2>Acesso ao documento</h2><p>Consulte o arquivo quando houver uma versão pública e autorizada vinculada a este registro.</p>${doc.arquivo?`<a class="button light" href="${esc(doc.arquivo)}">Acessar documento ↗</a><a class="button light" style="margin-top:8px" download href="${esc(doc.arquivo)}">Baixar PDF ↓</a>`:'<span class="button outline" style="background:transparent;color:white;border-color:#6f9e98">Arquivo não disponível</span>'}</div><a class="button outline" href="documentos.html">← Voltar ao catálogo</a></aside></div>`}</script></body></html>
