<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autor | ESP/MA</title><meta name="description" content="Produções associadas a um autor no Repositório Institucional ESP/MA."><meta name="keywords" content="autor, produção, ESP/MA"><meta property="og:title" content="Autor | Repositório ESP/MA"><meta property="og:description" content="Produções associadas a um autor do catálogo."><meta property="og:type" content="profile"><link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/styles.css"></head><body><div data-header></div><main id="conteudo"><section class="page-hero"><div class="container"><p class="breadcrumb"><a href="autores.html">Autores</a> / Registro de autor</p><div id="author-header"></div></div></section><section class="section"><div class="container"><div id="author-docs" class="document-list"></div></div></section></main><div data-footer></div><script type="module">import {getData} from './assets/js/data.js';import {renderShell,documentCard,emptyState} from './assets/js/components.js';import {setMeta,esc} from './assets/js/site-config.js';renderShell('Autores');const name=new URLSearchParams(location.search).get('nome');const {docs}=await getData();const found=docs.filter(d=>(d.autores||[]).includes(name));setMeta({title:name||'Autor'});document.querySelector('#author-header').innerHTML=`<p class="eyebrow">Autor no catálogo</p><h1>${esc(name||'Autor não informado')}</h1><p>${found.length} ${found.length===1?'produção localizada':'produções localizadas'} nos registros públicos atuais.</p>`;document.querySelector('#author-docs').innerHTML=found.length?found.map(documentCard).join(''):emptyState('Nenhuma produção associada','Este nome ainda não possui documentos associados no catálogo.');</script></body></html>
