<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produções | ESP/MA</title><meta name="description" content="Consulte e filtre as produções acadêmicas, técnicas e institucionais catalogadas pela ESP/MA."><meta name="keywords" content="produções ESP/MA, artigos, TCC, relatórios, saúde pública"><meta property="og:title" content="Produções | Repositório ESP/MA"><meta property="og:description" content="Consulte e filtre o catálogo institucional da ESP/MA."><meta property="og:type" content="website"><link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/styles.css"></head><body><div data-header></div><main id="conteudo"><section class="page-hero"><div class="container"><p class="breadcrumb"><a href="index.html">Início</a> / Produções</p><p class="eyebrow">Catálogo documental</p><h1>Produções e documentos</h1><p>Encontre registros por título, autor, tema, palavra-chave, ano, tipo, curso ou coleção.</p></div></section><section class="section"><div class="container catalog-layout"><aside class="filter-box"><h2>Refinar consulta</h2><form id="search-form"><div class="field"><label for="q">Busca livre</label><input id="q" name="q" type="search" placeholder="Ex.: educação permanente"></div><div class="field"><label for="tipo">Tipo de documento</label><select id="tipo" name="tipo"><option value="">Todos os tipos</option></select></div><div class="field"><label for="ano">Ano</label><select id="ano" name="ano"><option value="">Todos os anos</option></select></div><div class="field"><label for="tema">Tema</label><select id="tema" name="tema"><option value="">Todos os temas</option></select></div><div class="field"><label for="curso">Curso</label><select id="curso" name="curso"><option value="">Todos os cursos</option></select></div><div class="field"><label for="autor">Autor</label><select id="autor" name="autor"><option value="">Todos os aut
