<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cursos | ESP/MA</title><meta name="description" content="Cursos e produções acadêmicas vinculadas aos registros do Repositório Institucional ESP/MA."><meta name="keywords" content="cursos, formação, ESP/MA, SUS"><meta property="og:title" content="Cursos | Repositório ESP/MA"><meta property="og:description" content="Consulte cursos e produções acadêmicas do catálogo."><meta property="og:type" content="website"><link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/styles.css"></head><body><div data-header></div><main id="conteudo"><section class="page-hero"><div class="container"><p class="breadcrumb"><a href="index.html">Início</a> / Cursos</p><p class="eyebrow">Formação e produção</p><h1>Cursos</h1><p>A estrutura está pronta para receber novos cursos sem alteração do código principal. Os itens atuais refletem apenas os registros cadastrados.</p></div></section><section class="section"><div class="container"><div id="courses" class="course-list"></div></div></section></main><div data-footer></div><script type="module">import {getData} from './assets/js/data.js';import {renderShell} from './assets/js/components.js';import {setMeta,esc} from './assets/js/site-config.js';renderShell('Cursos');setMeta({title:'Cursos'});const {courses,docs}=await getData();document.querySelector('#courses').innerHTML=courses.map(course=>{const related=docs.filter(d=>d.curso===course);return `<article class="profile-card"><p class="eyebrow">Curso no catálogo</p><h2>${esc(course)}</h2><p>${related.length} ${related.length===1?'produção vinculada':'produções vinculadas'}</p><a href="documentos.html?curso=${encodeURIComponent(course)}">Ver produções →</a></article>`}).join('');</script></body></html>
